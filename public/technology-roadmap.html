        function initializeRoadmap() {
            populateL1Filter();
            renderRoadmap();
        }
        
        function populateL1Filter() {
            const select = document.getElementById('l1Filter');
            roadmapData.forEach(l1 => {
                const option = document.createElement('option');
                option.value = l1.l1_id;
                option.textContent = l1.l1_name;
                select.appendChild(option);
            });
        }
        
        function renderRoadmap() {
            const container = document.getElementById('roadmapContainer');
            const l1Filter = document.getElementById('l1Filter').value;
            const orgFilter = document.getElementById('orgUnitFilter').value;
            
            let filtered = roadmapData.filter(l1 => {
                const l1Match = l1Filter === 'all' || l1.l1_id === l1Filter;
                const orgMatch = orgFilter === 'all' || l1.org_unit === orgFilter;
                return l1Match && orgMatch;
            });
            
            container.innerHTML = filtered.map(l1 => {
                const currentTechBadges = l1.current_technologies.map(tech => 
                    `<span class="tech-badge current">${tech}</span>`
                ).join('');
                
                const years = ['2026', '2027', '2028', '2029', '2030'];
                
                const yearColumns = years.map(year => {
                    const yearData = l1.roadmap[year];
                    if (!yearData) return '';
                    
                    const phase = year <= '2027' ? 'phase-1' : year <= '2029' ? 'phase-2' : 'phase-3';
                    const phaseLabel = year <= '2027' ? 'Foundation' : year <= '2029' ? 'Automation' : 'Optimization';
                    
                    const currentTechs = yearData.current.map(tech =>
                        `<div class="tech-item current">✓ ${tech}</div>`
                    ).join('');
                    
                    const proposedTechs = yearData.proposed.map(tech =>
                        `<div class="tech-item proposed">+ ${tech}</div>`
                    ).join('');
                    
                    const deliverables = yearData.deliverables.map(del =>
                        `<div class="deliverable-item">${del}</div>`
                    ).join('');
                    
                    return `
                        <div class="year-column">
                            <div class="year-header">
                                ${year}
                                <span class="phase-indicator ${phase}">${phaseLabel}</span>
                            </div>
                            
                            ${currentTechs ? `
                                <div class="tech-section">
                                    <div class="tech-section-title">Current</div>
                                    <div class="tech-list">${currentTechs}</div>
                                </div>
                            ` : ''}
                            
                            ${proposedTechs ? `
                                <div class="tech-section">
                                    <div class="tech-section-title">Proposed</div>
                                    <div class="tech-list">${proposedTechs}</div>
                                </div>
                            ` : ''}
                            
                            ${deliverables ? `
                                <div class="deliverables">
                                    <div class="tech-section-title">Deliverables</div>
                                    ${deliverables}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
                
                return `
                    <div class="roadmap-row" data-l1-id="${l1.l1_id}" data-org-unit="${l1.org_unit}">
                        <div class="l1-header" onclick="toggleRow('${l1.l1_id}')">
                            <div>
                                <div>${l1.l1_name}</div>
                                <div class="l1-description">${l1.l1_description}</div>
                            </div>
                            <span class="expand-icon">▼</span>
                        </div>
                        
                        <div class="current-tech-banner">
                            <div class="current-tech-label">Current Technology Landscape:</div>
                            <div class="tech-badges">
                                ${currentTechBadges || '<span style="color: #7f8c8d;">No technology currently identified</span>'}
                            </div>
                        </div>
                        
                        <div class="timeline-grid">
                            ${yearColumns}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function toggleRow(l1Id) {
            const row = document.querySelector(`.roadmap-row[data-l1-id="${l1Id}"]`);
            if (row) {
                row.classList.toggle('collapsed');
            }
        }
        
        function filterByOrgUnit() {
            renderRoadmap();
        }
        
        function filterByL1() {
            renderRoadmap();
        }
        
        function updateViewMode() {
            const mode = document.getElementById('viewMode').value;
            document.querySelectorAll('.roadmap-row').forEach(row => {
                if (mode === 'collapsed') {
                    row.classList.add('collapsed');
                } else {
                    row.classList.remove('collapsed');
                }
            });
        }
        
        window.addEventListener('DOMContentLoaded', initializeRoadmap);
    </script>
